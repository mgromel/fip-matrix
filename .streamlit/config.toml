# App theme.
#
# primaryColor is a pastel blue. Blue is free for chrome: the status scale is
# tan / aqua / lime and the chart series are aqua and tan, so no button, tab
# indicator, focus ring or filter chip can be mistaken for data. Both shades are
# picked for label contrast on their own fill — 4.7:1 with white ink in light
# mode, 10.6:1 with black ink in dark mode. Surfaces and ink follow the same
# design tokens the charts are validated against.

[theme]
base = "light"
primaryColor = "#3f76b0"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
linkColor = "#2a78d6"
borderColor = "#e1e0d9"
dataframeBorderColor = "#e1e0d9"
dataframeHeaderBackgroundColor = "#f0efec"
font = "sans-serif"
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true

[theme.dark]
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#2c2c2a"
textColor = "#ffffff"
primaryColor = "#8fbde8"
linkColor = "#6da7ec"
borderColor = "#2c2c2a"
dataframeBorderColor = "#2c2c2a"
dataframeHeaderBackgroundColor = "#2c2c2a"

[client]
# Replaces the CSS that used to hide #MainMenu / header / .stAppToolbar. Those
# selectors target Streamlit's internal DOM and break on upgrades.
toolbarMode = "minimal"
